<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login · Low-fidelity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1A1A;--mid:#737373;--line:#CCCCCC;--soft:#F2F2F2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
.screen{width:100%;max-width:402px;min-height:100dvh;margin:0 auto;padding:88px 24px 40px;display:flex;flex-direction:column}
.content{display:flex;flex-direction:column;gap:32px}
.header{display:flex;flex-direction:column;gap:12px}
.logo{width:56px;height:56px;border-radius:14px;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--mid)}
h1{font-size:28px;font-weight:700;line-height:1.15}
.sub{font-size:15px;color:var(--mid);line-height:1.4}
form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:13px;font-weight:500}
.input{height:52px;padding:0 16px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:8px;background:#fff}
.input:focus-within{border-color:var(--ink)}
.input input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--ink)}
.input input::placeholder{color:var(--mid)}
.show{border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--mid);cursor:pointer}
.forgot{align-self:flex-end;font-size:13px;font-weight:500;color:var(--ink);text-decoration:none}
.btn{height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;width:100%}
.primary{background:var(--ink);color:#fff;border:0}
.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-size:15px;font-weight:500}
.dot{width:20px;height:20px;border-radius:50%;background:var(--line)}
.divider{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mid)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.spacer{flex:1;min-height:32px}
.footer{display:flex;justify-content:center;gap:4px;font-size:14px;color:var(--mid)}
.footer a{font-weight:600;color:var(--ink);text-decoration:none}
@media (min-width:500px){body{background:#EDEDED;display:flex;align-items:center;justify-content:center}.screen{min-height:874px;height:874px;background:#fff;border-radius:40px;box-shadow:0 20px 60px rgba(0,0,0,.12)}}
</style>
</head>
<body>
<main class="screen">
  <div class="content">
    <div class="header">
      <div class="logo">Logo</div>
      <h1>Welcome back</h1>
      <p class="sub">Log in to continue to your account.</p>
    </div>
    <form onsubmit="return false">
      <div class="field">
        <label for="email">Email</label>
        <div class="input"><input id="email" type="email" placeholder="you@example.com" autocomplete="email"></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input"><input id="password" type="password" placeholder="Enter your password" autocomplete="current-password"><button class="show" type="button" id="toggle">Show</button></div>
      </div>
      <a class="forgot" href="#">Forgot password?</a>
      <button class="btn primary" type="submit">Log in</button>
    </form>
    <div class="divider">or</div>
    <button class="btn secondary" type="button"><span class="dot"></span>Continue with Google</button>
  </div>
  <div class="spacer"></div>
  <div class="footer"><span>Don't have an account?</span><a href="#">Sign up</a></div>
</main>
<script>
var p=document.getElementById('password'),t=document.getElementById('toggle');
t.addEventListener('click',function(){var s=p.type==='password';p.type=s?'text':'password';t.textContent=s?'Hide':'Show';});
</script>
</body>
</html>
